plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cleantv.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.cleantv.launcher'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB, never published: the debug key lets a release install over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No runtime dependencies: the launcher uses only the Android framework.
    testImplementation 'junit:junit:4.13.2'
}
